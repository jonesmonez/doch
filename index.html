<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#080a12" />
  <meta name="description" content="Doch." />
  <title>Doch</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080a12;
      --ink: #f9f8f6;
      --x: 50%;
      --y: 45%;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: var(--bg);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .stage {
      position: relative;
      isolation: isolate;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 2rem;
      overflow: hidden;
      background:
        radial-gradient(ellipse 55% 55% at 49% 55%, rgba(52, 62, 104, .18), transparent 73%),
        #080a12;
    }

    .stage::before {
      content: "";
      position: absolute;
      z-index: -2;
      inset: -30%;
      background:
        radial-gradient(ellipse 24% 31% at 36% 43%, rgba(115, 93, 252, .54), transparent 72%),
        radial-gradient(ellipse 25% 27% at 65% 57%, rgba(40, 173, 214, .38), transparent 74%),
        radial-gradient(ellipse 22% 25% at 59% 32%, rgba(227, 76, 152, .25), transparent 74%);
      filter: blur(clamp(42px, 7vw, 108px));
      opacity: .9;
      animation: breathe 11s ease-in-out infinite alternate;
    }

    .stage::after {
      content: "";
      position: absolute;
      z-index: 3;
      inset: 0;
      pointer-events: none;
      opacity: .38;
      background:
        radial-gradient(circle at var(--x) var(--y), rgba(255, 255, 255, .075), transparent 34%),
        radial-gradient(ellipse at center, transparent 35%, rgba(1, 2, 9, .67) 100%);
    }

    .ring {
      position: absolute;
      z-index: -1;
      width: min(73vw, 760px);
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1px solid rgba(227, 226, 255, .085);
      box-shadow: 0 0 80px rgba(180, 159, 255, .035), inset 0 0 80px rgba(180, 159, 255, .035);
      transform: rotate(-18deg) scaleY(.8);
      animation: arrive-ring 1.6s cubic-bezier(.19, 1, .22, 1) both;
    }

    .ring::before,
    .ring::after {
      content: "";
      position: absolute;
      inset: 13%;
      border-radius: inherit;
      border: 1px solid rgba(227, 226, 255, .065);
    }

    .ring::after {
      inset: -15%;
      opacity: .55;
    }

    h1 {
      position: relative;
      z-index: 2;
      margin: 0;
      color: var(--ink);
      font-size: clamp(5.6rem, 21vw, 20rem);
      line-height: .95;
      letter-spacing: -.095em;
      font-weight: 800;
      padding-right: .095em;
      text-align: center;
      text-shadow: 0 14px 70px rgba(0, 0, 0, .3);
      animation: arrive 1.25s cubic-bezier(.16, 1, .3, 1) both;
    }

    h1::selection {
      background: #a79bf9;
      color: #080a12;
    }

    @keyframes arrive {
      from {
        opacity: 0;
        transform: translateY(32px) scale(.95);
        filter: blur(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    @keyframes arrive-ring {
      from {
        opacity: 0;
        transform: rotate(-18deg) scaleY(.72) scale(.88);
      }

      to {
        opacity: 1;
        transform: rotate(-18deg) scaleY(.8) scale(1);
      }
    }

    @keyframes breathe {
      0% {
        transform: translate(-2%, 1%) rotate(-8deg) scale(1);
      }

      100% {
        transform: translate(2%, -2%) rotate(8deg) scale(1.13);
      }
    }

    @media (max-width: 600px) {
      .stage {
        padding: 1.25rem;
      }

      h1 {
        font-size: clamp(5.6rem, 24vw, 10rem);
      }

      .ring {
        width: 112vw;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="stage" aria-label="Doch">
    <div class="ring" aria-hidden="true"></div>
    <h1>Doch</h1>
  </main>
  <script>
    if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
      document.addEventListener('pointermove', (event) => {
        document.documentElement.style.setProperty('--x', `${(event.clientX / innerWidth) * 100}%`);
        document.documentElement.style.setProperty('--y', `${(event.clientY / innerHeight) * 100}%`);
      }, {passive: true});
    }
  </script>
</body>

</html>
